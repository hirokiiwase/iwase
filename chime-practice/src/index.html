<title>チャイム練習帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Music&display=swap">
<style>
/* レイアウト: 上から「ステージ(流れる譜)→いま/つぎ→大きな音ボタン→操作→小節マップ」。スマホ縦持ち優先。 */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#17212b; --muted:#5d6b79; --line:#d9e0e7;
  --chime1:#b85c00; --chime1-soft:#fde9d3;
  --chime2:#0b7285; --chime2-soft:#d5f0f5;
  --chime3:#6741d9; --chime3-soft:#e6dfff;
  --ok:#2b8a3e; --warn:#b36b00; --bad:#c92a2a;
  --stage:#101a26; --stage-fg:#e8eef5; --stage-dim:#6d8196; --stage-line:#2a3a4d;
  --paper:#fbfaf6; --ink:#1b2430; --ink-dim:#7d8a97; --staff:#8d99a6;
  --font-d:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --font-b:'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1118; --panel:#161e29; --fg:#e8eef5; --muted:#92a1b1; --line:#2a3646;
  --chime1:#ffa94d; --chime1-soft:#3a2a14;
  --chime2:#4dd0e1; --chime2-soft:#10343b;
  --chime3:#b197fc; --chime3-soft:#2b2352;
  --ok:#69db7c; --warn:#ffc078; --bad:#ff8787;
  --stage:#0a0f16; --stage-fg:#e8eef5; --stage-dim:#6d8196; --stage-line:#26344a;
  --paper:#0f1620; --ink:#e9eff6; --ink-dim:#7f93a8; --staff:#4a5d73;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1118; --panel:#161e29; --fg:#e8eef5; --muted:#92a1b1; --line:#2a3646;
  --chime1:#ffa94d; --chime1-soft:#3a2a14;
  --chime2:#4dd0e1; --chime2-soft:#10343b;
  --chime3:#b197fc; --chime3-soft:#2b2352;
  --ok:#69db7c; --warn:#ffc078; --bad:#ff8787;
  --stage:#0a0f16; --stage-fg:#e8eef5; --stage-dim:#6d8196; --stage-line:#26344a;
  --paper:#0f1620; --ink:#e9eff6; --ink-dim:#7f93a8; --staff:#4a5d73;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.55;
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--font-d);margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:900;letter-spacing:.02em}
h2{font-size:16px;font-weight:700}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top small{color:var(--muted);display:block;font-size:12px}
select,button,input{font:inherit;color:inherit}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:40px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--chime2);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modes label{display:block;text-align:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 4px;font-weight:700;cursor:pointer;font-family:var(--font-d);min-height:44px}
.modes input{position:absolute;opacity:0;pointer-events:none}
.modes input:checked+span{color:#fff}
.modes label:has(input:checked){background:var(--fg);color:var(--bg);border-color:var(--fg)}
.modehelp{color:var(--muted);font-size:13px;margin:6px 2px 0}
.stagewrap{background:var(--stage);border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--stage-line)}
canvas{display:block;width:100%;height:340px;touch-action:pan-y;cursor:grab}
canvas:active{cursor:grabbing}
.viewbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg label{padding:8px 14px;font-weight:700;font-family:var(--font-d);cursor:pointer;min-height:40px;display:flex;align-items:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--fg);color:var(--bg)}
.seg label:has(input:focus-visible){outline:3px solid var(--chime2);outline-offset:-3px}
.stagewrap.paper{background:var(--paper)}
.stagewrap.paper .banner{color:var(--ink);top:6px;text-align:right;padding-right:14px;font-size:19px;text-shadow:0 0 8px var(--paper),0 0 2px var(--paper)}
.banner{position:absolute;left:0;right:0;top:34px;text-align:center;pointer-events:none;font-family:var(--font-d);font-weight:900;font-size:26px;color:var(--stage-fg);opacity:0;transition:opacity .08s}
.banner.on{opacity:1}
.hud{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.pos{font-family:var(--font-d);font-weight:900;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;min-width:5.5em}
.pos small{display:block;font-size:12px;font-weight:500;color:var(--muted);font-family:var(--font-b)}
.next{display:flex;align-items:center;gap:10px;min-width:0}
.next .chip{flex:none}
.next .txt{min-width:0}
.next .txt b{font-family:var(--font-d);font-size:17px}
.next .txt span{display:block;color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;height:2.6em;padding:0 .5em;border-radius:999px;font-family:var(--font-d);font-weight:900;color:#fff;background:var(--c,#444)}
.chimes{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px}
.bigbtn{border:0;border-radius:18px;min-height:132px;background:var(--c);color:#fff;font-family:var(--font-d);font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .05s,box-shadow .05s}
.bigbtn .k{font-size:44px;line-height:1}
.bigbtn .p{font-size:14px;font-weight:700;opacity:.92}
.bigbtn .h{font-size:11px;font-weight:500;opacity:.8}
.bigbtn.down{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.bigbtn.target{outline:5px solid var(--fg);outline-offset:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bigbtn{color:#0b1118}}
:root[data-theme="dark"] .bigbtn{color:#0b1118}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.primary{border:0;background:var(--fg);color:var(--bg);font-weight:700;font-family:var(--font-d);border-radius:10px;padding:10px 20px;min-height:46px;font-size:16px}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;min-height:44px}
.ctl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ctl>span{font-size:12px;color:var(--muted)}
.ctl input[type=range]{width:100%;min-width:140px;min-height:32px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 16px}
.tg{display:flex;gap:8px;align-items:center;min-height:36px}
.tg input{width:20px;height:20px}
.result{display:none}
.result.on{display:block}
.result .nums{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-d);font-weight:700;font-size:18px;margin-top:6px}
.result .ok{color:var(--ok)}.result .warn{color:var(--warn)}.result .bad{color:var(--bad)}
.feedback{min-height:1.7em;font-family:var(--font-d);font-weight:700;font-size:17px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:8px}
.m{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--panel);text-align:left;min-height:62px;display:flex;flex-direction:column;gap:4px}
.m.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg) inset}
.m .n{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.m .cs{display:flex;flex-wrap:wrap;gap:4px}
.mc{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;color:var(--c);background:var(--cs);border:1.5px solid var(--c)}
.mc.hit{background:var(--ok);color:#fff;border-color:var(--ok)}
.mc.near{background:var(--warn);color:#fff;border-color:var(--warn)}
.mc.miss{background:var(--bad);color:#fff;border-color:var(--bad)}
.m.dim{opacity:.55}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:12px}
.foot{color:var(--muted);font-size:12px}
body.mode-metro .songonly{display:none!important}
.metro{display:none}
body.mode-metro .metro{display:block}
.seek{display:flex;gap:8px;align-items:center}
.seek input[type=range]{flex:1;min-width:0;min-height:36px}
.seek .ghost{padding:8px 10px;white-space:nowrap}
.bignum{font-family:var(--font-d);font-weight:900;font-size:68px;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.bignum small{font-size:15px;font-weight:500;color:var(--muted);margin-left:6px}
.beats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
.beat{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:var(--panel)}
.beat.on{background:var(--chime2);border-color:var(--chime2)}
.beat.acc{border-color:var(--chime1)}
.beat.acc.on{background:var(--chime1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){.modes{grid-template-columns:repeat(2,1fr)}.hud{grid-template-columns:1fr}canvas{height:320px}.bigbtn{min-height:120px}}
</style>

<main>
  <div class="top">
    <div>
      <h1 id="songTitle">チャイム練習帳</h1>
      <small id="songSub"></small>
    </div>
    <label class="ctl"><span>曲</span><select id="songSel" aria-label="曲を選ぶ"></select></label>
  </div>

  <div>
    <div class="modes" role="radiogroup" aria-label="練習モード">
      <label><input type="radio" name="mode" value="listen"><span>① 聴く</span></label>
      <label><input type="radio" name="mode" value="step"><span>② ステップ</span></label>
      <label><input type="radio" name="mode" value="timing"><span>③ タイミング</span></label>
      <label><input type="radio" name="mode" value="metro"><span>④ メトロノーム</span></label>
    </div>
    <p class="modehelp" id="modeHelp"></p>
  </div>

  <div class="viewbar songonly">
    <div class="seg" role="radiogroup" aria-label="譜面の表示">
      <label><input type="radio" name="view" value="roll"><span>流れる音</span></label>
      <label><input type="radio" name="view" value="score"><span>ピアノ譜</span></label>
    </div>
    <label class="tg" id="namesTg"><input type="checkbox" id="optNames"><span>ほかの音にも音名（ドレミ）を付ける</span></label>
  </div>
  <div class="stagewrap songonly" id="stagewrap">
    <canvas id="stage" aria-label="自分の音が流れてくる画面"></canvas>
    <div class="banner" id="banner">いま！</div>
  </div>
  <div class="seek songonly">
    <button class="ghost" id="seekBack" aria-label="1小節戻る">◀ 1小節</button>
    <input type="range" id="seek" min="0" max="100" step="1" value="0" aria-label="曲の位置（小節）">
    <button class="ghost" id="seekFwd" aria-label="1小節進む">1小節 ▶</button>
  </div>

  <div class="card metro" id="metroCard">
    <div class="bignum"><span id="metroBpm">100</span><small>♩/分</small></div>
    <div class="beats" id="beats" aria-hidden="true"></div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="ghost" id="bpmM5">−5</button><button class="ghost" id="bpmM1">−1</button>
      <button class="ghost" id="bpmP1">＋1</button><button class="ghost" id="bpmP5">＋5</button>
      <button class="ghost" id="tap">タップでテンポ</button>
    </div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <label class="ctl"><span>拍子（1小節の拍数）</span><select id="metroMeter"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></label>
      <label class="tg"><input type="checkbox" id="metroAccent" checked><span>1拍めを強く</span></label>
    </div>
  </div>

  <div class="card hud songonly">
    <div class="pos" id="pos">— <small id="posSub">停止中</small></div>
    <div class="next" id="next"></div>
  </div>

  <div class="chimes songonly" id="chimes"></div>
  <div class="feedback songonly" id="feedback" aria-live="polite"></div>

  <div class="card">
    <div class="row">
      <button class="primary" id="btnPlay">▶ はじめる</button>
      <button class="ghost" id="btnStop">■ とめる</button>
      <label class="ctl songonly"><span>ここから</span><select id="startSel"></select></label>
      <label class="tg songonly"><input type="checkbox" id="loopOn"><span>ここまでをくり返す</span></label>
      <label class="ctl songonly"><span>終わりの小節</span><select id="endSel"></select></label>
    </div>
    <div class="grid2" style="margin-top:12px">
      <label class="ctl"><span>音量 <b id="volVal"></b></span><input type="range" id="vol" min="0" max="100" step="5"></label>
      <label class="ctl"><span>テンポ <b id="bpmVal"></b></span><input type="range" id="bpm" min="30" max="200" step="1"></label>
      <label class="ctl songonly"><span>判定のずれ補正 <b id="offVal"></b>（イヤホンで遅れるときに）</span><input type="range" id="off" min="-150" max="250" step="10" value="0"></label>
      <label class="tg songonly"><input type="checkbox" id="optCount" checked><span>はじめにカウントを入れる</span></label>
      <label class="tg songonly"><input type="checkbox" id="optMetro"><span>メトロノーム（拍のクリック）</span></label>
      <label class="tg songonly"><input type="checkbox" id="optOthers" checked><span>ほかの人の音を鳴らす</span></label>
    </div>
  </div>

  <div class="card result songonly" id="result" aria-live="polite"></div>

  <div class="card songonly">
    <h2>あなたの鳴らす場所マップ</h2>
    <div class="legend" id="legend"></div>
    <div class="map" id="map"></div>
  </div>

  <p class="foot">タップ、またはキーボード（スペース＝いまの音 / F・J＝左・右のチャイム / ←→＝1小節移動）で操作できます。譜面（ピアノ譜／流れる音）は指やマウスでドラッグすると前後に動きます。小節カードを押すと、そこから練習を始められます。</p>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const SOLFEGE = {C:'ド',D:'レ',E:'ミ',F:'ファ',G:'ソ',A:'ラ',B:'シ'};
const SEMI = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const MODE_HELP = {
  listen:'まず曲全体を聴いて流れをつかみます。あなたの音は光って鳴ります。',
  step:'あなたの音の直前で曲が止まります。その音のボタンを押すと続きが流れます。',
  timing:'曲は止まりません。あなたの音のタイミングでボタンを押して、ずれを確かめます。',
  metro:'メトロノームだけを鳴らします。テンポと拍子を決めて、練習の土台にします。'
};

/* ---------- 保存 ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('chimeprac.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('chimeprac.'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- 音名 ---------- */
function parsePitch(s, key){
  key = Array.isArray(key) ? {flats:key,sharps:[]} : (key||{flats:[],sharps:[]});
  const m = /^([A-G])([♭♯♮b#]?)(-?\d)$/.exec(s);
  if(!m) throw new Error('bad pitch '+s);
  let [, L, acc, oct] = m;
  let semi = SEMI[L];
  if(acc==='b') acc='♭'; else if(acc==='#') acc='♯';
  if(acc==='♭') semi--; else if(acc==='♯') semi++;
  else if(acc==='' && key.flats.includes(L)) { semi--; acc='♭'; }
  else if(acc==='' && key.sharps.includes(L)) { semi++; acc='♯'; }
  const midi = 12*(parseInt(oct,10)+1)+semi;
  const shown = (acc==='♮'?'♮':acc==='♭'?'♭':acc==='♯'?'♯':'');
  return {midi, letter:L, acc, oct:+oct, name:L+shown+oct, solfege:SOLFEGE[L]+shown};
}

/* ---------- 曲の展開 ---------- */
function compile(song){
  const meter = song.meter || 4;
  const kf = {flats:song.keyFlats||[], sharps:song.keySharps||[]};
  const mine = song.myChimes.map(p => parsePitch(p, kf));
  const myMidi = new Set(mine.map(p => p.midi));
  const lanes = [...mine].sort((a,b)=>a.midi-b.midi);
  const dup = new Set(lanes.map(l=>l.solfege)).size < lanes.length;
  if(dup){ const names=['低','高']; lanes.forEach((l,i)=>{ l.solfege = (lanes.length===2?names[i]:'')+l.solfege; }); }
  const events = [];
  const entries = [];
  const cues = [];
  const melody = [], melMap = new Map();
  song.playOrder.forEach((mnum, idx) => {
    const ms = song.measures[mnum]; if(!ms) return;
    const base = idx*meter;
    for(const hand of ['RH','LH']){
      for(const n of (ms[hand]||[])){
        const t = base + (n.beat-1);
        const ps = (n.pitches||[]).map(p => parsePitch(p, kf));
        entries.push({idx, mnum, hand, t, beat:n.beat, dur:n.dur, notes:ps, rest:ps.length===0, tremolo:!!n.tremolo, pos:n.pos});
        for(const p of ps){
          const isMine = myMidi.has(p.midi);
          const ev = {t, dur:n.dur, midi:p.midi, name:p.name, hand, mine:isMine, tremolo:!!n.tremolo, idx, mnum, beat:n.beat};
          events.push(ev);
          if(isMine){
            const cue = {id:cues.length, t, dur:n.dur, midi:p.midi, p, tremolo:!!n.tremolo, idx, mnum, beat:n.beat, state:'pending', played:false, delta:null};
            ev.cue = cue; cues.push(cue); p.cue = cue;
            if(n.tremolo){
              for(let k=1; k*0.25 < n.dur-0.01; k++) events.push({t:t+k*0.25, dur:0.25, midi:p.midi, name:p.name, hand, mine:true, sub:true, cue, idx, mnum});
            }
          } else if(n.tremolo){
            for(let k=1; k*0.25 < n.dur-0.01; k++) events.push({t:t+k*0.25, dur:0.25, midi:p.midi, name:p.name, hand, mine:false, sub:true, soft:true, idx, mnum});
          }
        }
        if(hand==='RH' && ps.length){
          const top = ps.reduce((a,b)=>b.midi>a.midi?b:a);
          const key = Math.round(t*100), cur = melMap.get(key);
          if(!cur || top.midi>cur.midi) melMap.set(key, {t, midi:top.midi, dur:n.dur, sol:top.solfege});
        }
      }
    }
  });
  melMap.forEach(v=>melody.push(v)); melody.sort((a,b)=>a.t-b.t);
  events.sort((a,b)=>a.t-b.t || (a.mine?1:0)-(b.mine?1:0));
  { const cnt=new Map(); events.forEach(e=>{ if(!e.sub){ const k=Math.round(e.t*1000); cnt.set(k,(cnt.get(k)||0)+1); } });
    events.forEach(e=>{ e.n = e.sub ? 1 : cnt.get(Math.round(e.t*1000)); }); }
  cues.sort((a,b)=>a.t-b.t || a.midi-b.midi);
  cues.forEach((c,i)=>{ c.id=i; c.p = lanes.find(l=>l.midi===c.midi); });
  const pulse = song.pulse || 1;
  const cs = {song, meter, pulse, whole: song.whole || 4, countIn: song.countIn || meter, mine, lanes, events, cues, melody, entries, total: song.playOrder.length*meter};
  cs.score = buildScore(cs, kf);
  return cs;
}

/* ---------- 音 ---------- */
let ctx=null, master=null;
// 圧縮器は小さい音を持ち上げる(量はブラウザごとに違う)。小さい音のゲインを実測して、ちょうど1倍になるよう戻す。
function calibrateLimiter(lim, post){
  try{
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if(!OAC) return;
    const sr=22050, oc=new OAC(1,sr/2,sr), o=oc.createOscillator(), a=oc.createGain(), c=oc.createDynamicsCompressor();
    o.frequency.value=440; a.gain.value=.02;
    c.threshold.value=lim.threshold.value; c.knee.value=lim.knee.value; c.ratio.value=lim.ratio.value; c.attack.value=lim.attack.value; c.release.value=lim.release.value;
    o.connect(a); a.connect(c); c.connect(oc.destination); o.start();
    const done = buf=>{ const d=buf.getChannelData(0); let pk=0; for(let i=d.length>>1;i<d.length;i++) pk=Math.max(pk,Math.abs(d[i])); const gain=pk/.02; if(gain>.3 && gain<8) post.gain.value=1/gain; };
    const r = oc.startRendering(); if(r && r.then) r.then(done).catch(()=>{}); else oc.oncomplete=e=>done(e.renderedBuffer);
  }catch(e){}
}
function applyVolume(){ if(master) master.gain.value = 1.2*Math.pow(S.vol/100,1.6); }
function audio(){
  if(!ctx){
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    // マスター音量 → リミッター(急な大音量を抑える) → ソフトクリップ(最後の安全装置) → 出力
    master = ctx.createGain();
    const lim = ctx.createDynamicsCompressor();
    lim.threshold.value=-12; lim.knee.value=10; lim.ratio.value=12; lim.attack.value=.003; lim.release.value=.2;
    // 圧縮器は小さい音を約1.7倍に持ち上げるので、その分を戻して「小さい音はそのまま・大きな山だけ抑える」にする
    const post = ctx.createGain(); post.gain.value=.6;   // 実測できるまでの仮の値(Chromeでの測定値)
    calibrateLimiter(lim, post);
    const sat = ctx.createWaveShaper(), n=2048, cur=new Float32Array(n);
    for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; cur[i]=Math.tanh(1.5*x)/Math.tanh(1.5); }
    sat.curve=cur; try{ sat.oversample='4x'; }catch(e){}
    master.connect(lim); lim.connect(post); post.connect(sat); sat.connect(ctx.destination);
    applyVolume();
  }
  if(ctx.state!=='running') { try{ const pr=ctx.resume(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){} }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  return ctx;
}
function strike(midi, vol=.5, soft=false, norm=1){
  vol *= norm;
  const c = audio(); const t = c.currentTime;
  const f = 440*Math.pow(2,(midi-69)/12);
  const decay = Math.min(2.6, Math.max(0.9, 1.9*Math.pow(261/f,.3))) * (soft?.45:1);   // 余韻を少し短くして、音の重なりを減らす
  const parts = [[1,1,1],[2.76,.32,.45],[5.4,.14,.25],[8.93,.05,.12]];
  for(const [r,g,d] of parts){
    const fr = f*r; if(fr>9000) continue;
    const o = c.createOscillator(), a = c.createGain();
    o.type='sine'; o.frequency.value=fr;
    a.gain.setValueAtTime(0,t);
    a.gain.linearRampToValueAtTime(g*vol*.38,t+.004);
    a.gain.setTargetAtTime(0,t+.004,decay*d/4);
    o.connect(a); a.connect(master);
    o.start(t); o.stop(t+decay*d*1.6+.1);
  }
}
function click(accent, when){
  const c = audio(); const t=when||c.currentTime;
  const o=c.createOscillator(), a=c.createGain();
  o.type='square'; o.frequency.value = accent?1500:1000;
  a.gain.setValueAtTime(.0001,t); a.gain.exponentialRampToValueAtTime(accent?.15:.09,t+.002);
  a.gain.exponentialRampToValueAtTime(.0001,t+.045);
  o.connect(a); a.connect(master); o.start(t); o.stop(t+.06);
}

/* ---------- 状態 ---------- */
const S = {
  songs: window.SONGS, cs:null, mode:store.get('mode','listen'),
  running:false, waiting:false, pending:[], pos:0, startPos:0, evIdx:0, last:0,
  bpm:100, offMs:store.get('off',0), timer:null, raf:0,
  loopEnd:null, loopStart:0, stats:null, flash:{}, bannerUntil:0, finished:false, startIdx:0, cursor:0, scrubbing:false, vol:store.get('vol',80), view:store.get('view','score')
};
const lanesColor = i => `var(--chime${i+1})`;

function fmtBeat(b){
  const i = Math.floor(b+1e-6), f = b-i;
  const sf = (S.cs&&S.cs.song.beatSuffix)||'拍め';
  if(Math.abs(f)<1e-6) return `${i}${sf}`;
  if(Math.abs(f-.5)<1e-6) return `${i}${sf}の裏`;
  return `${i}${sf}+${f.toFixed(2)}`;
}
function laneIndex(cue){ return S.cs.lanes.findIndex(p=>p.midi===cue.midi); }

/* ---------- 曲を読み込む ---------- */
function loadSong(id){
  const song = S.songs.find(s=>s.id===id) || S.songs[0];
  S.cs = compile(song);
  store.set('song', song.id);
  S.bpm = store.get('bpm.'+song.id, song.tempo||100);
  $('songTitle').textContent = song.title;
  $('songSub').textContent = [song.subtitle, song.arranger].filter(Boolean).join(' ／ ');
  setBpm(S.bpm);
  // 開始/終了セレクト
  const uniq = []; song.playOrder.forEach((m,i)=>{ if(!uniq.some(u=>u.m===m)) uniq.push({m,i}); });
  $('startSel').innerHTML = uniq.map(u=>`<option value="${u.i}">${u.m}小節</option>`).join('');
  $('endSel').innerHTML = uniq.map(u=>`<option value="${u.i}">${u.m}小節</option>`).join('');
  $('endSel').selectedIndex = uniq.length-1;
  S.startIdx=0; S.cursor=0; $('seek').max=song.playOrder.length-1;
  buildChimes(); buildMap(); resetCues(0);
  hudIdle();
  if(S.mode==='metro') setBpm(store.get('bpm.metro',100));
}
function buildChimes(){
  const box = $('chimes'); box.style.setProperty('--n', S.cs.lanes.length);
  box.innerHTML='';
  const keys = ['F','J','K','L'];
  S.cs.lanes.forEach((p,i)=>{
    const b = document.createElement('button');
    b.className='bigbtn'; b.dataset.midi=p.midi; b.style.setProperty('--c', lanesColor(i));
    b.innerHTML = `<span class="k">${p.solfege}</span><span class="p">${p.name}</span><span class="h">キー ${keys[i]||''}</span>`;
    b.addEventListener('pointerdown', e=>{ e.preventDefault(); b.classList.add('down'); press(p.midi); });
    const up=()=>b.classList.remove('down');
    b.addEventListener('pointerup',up); b.addEventListener('pointerleave',up); b.addEventListener('pointercancel',up);
    box.appendChild(b);
  });
  S.keyMap = {}; S.cs.lanes.forEach((p,i)=>{ if(keys[i]) S.keyMap[keys[i].toLowerCase()] = p.midi; });
  // 凡例
  $('legend').innerHTML = S.cs.lanes.map((p,i)=>`<span><span class="chip" style="--c:${lanesColor(i)};height:1.7em;min-width:1.7em;font-size:12px">${p.solfege}</span> ${p.name}（回数: ${S.cs.cues.filter(c=>c.midi===p.midi).length}／くり返し込み）</span>`).join('')
    + '<span>色: 緑=ばっちり 橙=おしい 赤=見逃し</span>';
}
let chipEls = {};
function buildMap(){
  const song = S.cs.song, map = $('map'); map.innerHTML=''; chipEls={};
  const uniq = []; song.playOrder.forEach(m=>{ if(!uniq.includes(m)) uniq.push(m); });
  for(const m of uniq){
    const idx = song.playOrder.indexOf(m);
    const cs = S.cs.cues.filter(c=>c.idx===idx);
    const d = document.createElement('button');
    d.className='m'+(cs.length?'':' dim'); d.dataset.idx=idx; d.dataset.m=m;
    const volta = song.voltas && song.voltas[m] ? `<span>${song.voltas[m]}</span>` : '';
    d.innerHTML = `<div class="n"><b>${m}</b>${volta}</div><div class="cs"></div>`;
    const box = d.querySelector('.cs');
    for(const c of cs){
      const li = laneIndex(c);
      const e = document.createElement('span'); e.className='mc';
      e.style.setProperty('--c', lanesColor(li)); e.style.setProperty('--cs', `var(--chime${li+1}-soft)`);
      e.textContent = `${c.p.solfege} ${fmtBeat(c.beat)}${c.tremolo?'〜':''}`;
      box.appendChild(e);
      // 同じ小節の2回目以降(くり返し)にも同じ表示を使うため、最初の idx だけ登録
      (chipEls[c.id] = chipEls[c.id] || []).push(e);
    }
    d.addEventListener('click', ()=>{ setStart(idx); window.scrollTo({top:0,behavior:'smooth'}); });
    map.appendChild(d);
  }
  // 2回目の出現(くり返し)の cue も同じ見た目の要素に反映できるよう m→要素の対応を作る
  S.chipByMeasureBeat = {};
  S.cs.cues.forEach(c=>{
    const first = song.playOrder.indexOf(c.mnum);
    const base = S.cs.cues.find(x=>x.idx===first && x.midi===c.midi && x.beat===c.beat);
    S.chipByMeasureBeat[c.id] = base ? chipEls[base.id] : [];
  });
  markStart();
}
function markStart(){
  const m = S.cs.song.playOrder[S.startIdx];
  document.querySelectorAll('.m').forEach(e=>e.classList.toggle('on', +e.dataset.m===m));
}
function paintChip(cue){
  const els = S.chipByMeasureBeat[cue.id] || [];
  els.forEach(e=>{ e.classList.remove('hit','near','miss'); if(cue.state==='hit'||cue.state==='near'||cue.state==='miss') e.classList.add(cue.state); });
}
function resetChips(){ S.cs.cues.forEach(c=>(S.chipByMeasureBeat[c.id]||[]).forEach(e=>e.classList.remove('hit','near','miss'))); }
function resetCues(fromPos){
  S.cs.cues.forEach(c=>{ if(c.t>=fromPos-1e-6){ c.state='pending'; c.played=false; c.delta=null; } });
}

/* ---------- 再生制御 ---------- */
function start(){
  audio();
  const cs = S.cs;
  const startIdx = S.startIdx;
  const startBeat = startIdx*cs.meter;
  const count = $('optCount').checked;
  S.startPos = startBeat;
  S.pos = startBeat - (count? cs.countIn : 0);
  S.countUntil = startBeat;
  S.lastInt = Math.floor(S.pos-1e-6);
  S.evIdx = cs.events.findIndex(e=>e.t>=startBeat-1e-6); if(S.evIdx<0) S.evIdx=cs.events.length;
  S.loopStart = startBeat;
  if($('loopOn').checked){
    const endIdx = +$('endSel').value;
    S.loopEnd = (Math.max(endIdx,startIdx)+1)*cs.meter;
  } else S.loopEnd = null;
  // 範囲外のキューは対象外にする(未到達のまま残さない)
  cs.cues.forEach(c=>{ c.state='pending'; c.played=false; c.delta=null; });
  cs.cues.forEach(c=>{ if(c.t<startBeat-1e-6) c.state='skip'; if(S.loopEnd!=null && c.t>=S.loopEnd-1e-6) c.state='skip'; });
  resetChips();
  S.stats = {hit:0,near:0,miss:0,extra:0,deltas:[]};
  S.running=true; S.waiting=false; S.pending=[]; S.finished=false;
  $('result').classList.remove('on');
  S.last = performance.now();
  clearInterval(S.timer); S.timer = setInterval(tick, 8);
  cancelAnimationFrame(S.raf); S.raf = requestAnimationFrame(frame);
  $('btnPlay').textContent='↻ やり直す';
  lockScreen(true);
  setFeedback('');
}
function stop(showResult){
  if(!S.running && !showResult) { hudIdle(); return; }
  S.running=false; S.waiting=false; S.scrubbing=false; clearInterval(S.timer);
  S.cursor=S.startIdx*S.cs.meter;
  $('btnPlay').textContent='▶ はじめる';
  lockScreen(false);
  if(showResult) showResults();
  hudIdle();
}
function finishSong(){ if(S.mode==='timing') S.cs.cues.forEach(c=>{ if(c.state==='pending') markMiss(c); }); S.finished=true; stop(S.mode!=='listen'); setFeedback('おしまい。おつかれさまです！'); }
let wake=null;
async function lockScreen(on){
  try{
    if(on && navigator.wakeLock && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null;}); }
    else if(!on && wake){ await wake.release(); wake=null; }
  }catch(e){ wake=null; }
}

function fireDue(limit){
  const ev=S.cs.events, batch=[];
  while(S.evIdx<ev.length && ev[S.evIdx].t<=limit) batch.push(ev[S.evIdx++]);
  const bn = batch.length>8 ? Math.sqrt(8/batch.length) : 1;   // 画面が固まって音がまとめて来ても、音量は増やさない
  for(const e of batch) fire(e,bn);
}
function fire(ev, norm=1){
  const mode = S.mode;
  norm *= Math.min(1, Math.sqrt(2/(ev.n||1)));   // 同時に鳴る音が多いほど1音あたりを小さく
  if(ev.mine){
    if(ev.sub){
      if(mode==='listen' || ev.cue.played) strike(ev.midi,.2,true,norm);
      return;
    }
    if(mode==='listen'){ strike(ev.midi,.4,false,norm); ev.cue.state='hit'; ev.cue.played=true; S.flash[ev.midi]=performance.now(); }
  } else if($('optOthers').checked){
    strike(ev.midi, ev.soft?.12 : ev.hand==='RH'?.30:.32, !!ev.soft, norm);
  }
}

function nextPendingCue(){
  return S.cs.cues.find(c=>c.state==='pending' && c.t>=S.pos-0.6);
}

function tick(){
  if(!S.running) return;
  const now = performance.now();
  let dt = Math.min(.1,(now-S.last)/1000); S.last = now;
  if(S.waiting||S.scrubbing) return;
  const cs = S.cs;
  let np = S.pos + dt*S.bpm*cs.pulse/60;
  // クリック
  const li = Math.floor(np);
  if(li > S.lastInt){
    for(let b=S.lastInt+1; b<=li; b++){
      const inCount = b < S.countUntil;
      if(((b%cs.pulse)+cs.pulse)%cs.pulse!==0) continue;
      if(inCount || $('optMetro').checked) click(((b%cs.meter)+cs.meter)%cs.meter===0);
    }
    S.lastInt = li;
  }
  // ステップ: 次の自分の音で止まる
  let stopAt = null;
  if(S.mode==='step'){
    const nc = cs.cues.find(c=>c.state==='pending' && c.t>=S.pos-1e-6 && c.t>=S.startPos-1e-6);
    if(nc && nc.t <= np+1e-9 && np>=S.countUntil-1e-9) stopAt = nc.t;
  }
  let limit = stopAt!==null ? stopAt-1e-6 : np;
  if(S.loopEnd!=null) limit = Math.min(limit, S.loopEnd-1e-6);
  fireDue(limit);
  if(stopAt!==null){
    S.pos = stopAt; S.waiting=true;
    S.pending = cs.cues.filter(c=>c.state==='pending' && Math.abs(c.t-stopAt)<1e-6);
    S.bannerUntil = Infinity; highlightTargets();
    return;
  }
  S.pos = np;
  // タイミング: 見逃し判定
  if(S.mode==='timing'){
    const pbNow = S.pos - (S.offMs/1000)*(S.bpm*cs.pulse/60);
    for(const c of cs.cues){
      if(c.state==='pending' && c.t + winU() < pbNow) markMiss(c);
    }
  }
  // ループ/終了
  if(S.loopEnd!=null && S.pos>=S.loopEnd){
    if(S.mode==='timing') cs.cues.forEach(c=>{ if(c.state==='pending') markMiss(c); });
    S.pos = S.loopStart; S.lastInt = Math.floor(S.pos-1e-6);
    S.evIdx = cs.events.findIndex(e=>e.t>=S.loopStart-1e-6);
    cs.cues.forEach(c=>{ if(c.t>=S.loopStart-1e-6 && c.t<S.loopEnd) { c.state='pending'; c.played=false; c.delta=null; } });
    resetChips();
  } else if(S.loopEnd==null && S.pos >= cs.total+1.5*cs.pulse){
    finishSong();
  }
}

function markMiss(c){
  c.state='miss'; S.stats.miss++; paintChip(c);
  setFeedback(`見逃し: ${c.p.solfege}（${c.mnum}小節 ${fmtBeat(c.beat)}）`,'bad');
}
function judgeDeltaMs(d){ return d*60000/(S.bpm*S.cs.pulse); }
function winU(){ return 380/60000*S.bpm*S.cs.pulse; }
function perfU(){ return 100/60000*S.bpm*S.cs.pulse; }

function press(midi){
  audio();
  const lane = S.cs.lanes.findIndex(p=>p.midi===midi);
  S.flash[midi] = performance.now();
  if(!S.running || S.mode==='listen'){
    strike(midi,.4); return;
  }
  if(S.mode==='step'){
    if(S.waiting){
      const c = S.pending.find(x=>x.midi===midi);
      if(c){
        c.state='hit'; c.played=true; S.stats.hit++; paintChip(c);
        strike(midi,.42);
        S.pending = S.pending.filter(x=>x!==c);
        setFeedback(`${c.p.solfege} OK（${c.mnum}小節 ${fmtBeat(c.beat)}）`,'ok');
        if(!S.pending.length){
          S.waiting=false; S.bannerUntil=0; S.last=performance.now(); clearTargets();
          // 同時刻の他パートを即座に鳴らす
          fireDue(S.pos+1e-6);
        }
      } else {
        strike(midi,.3,true); S.stats.extra++;
        const want = S.pending.map(x=>x.p.solfege).join('・');
        setFeedback(`ちがいます。いまは「${want}」`,'bad');
      }
    } else {
      strike(midi,.3,true); S.stats.extra++;
      const nc = nextPendingCue();
      setFeedback(nc?`まだです。つぎは「${nc.p.solfege}」${nc.mnum}小節 ${fmtBeat(nc.beat)}`:'まだです','warn');
    }
    return;
  }
  // timing
  const pb = S.pos - (S.offMs/1000)*(S.bpm*S.cs.pulse/60);
  let best=null;
  for(const c of S.cs.cues){
    if(c.state!=='pending' || c.midi!==midi) continue;
    const d = pb - c.t;
    if(Math.abs(d)<=winU() && (!best || Math.abs(d)<Math.abs(best.d))) best={c,d};
  }
  if(!best){ strike(midi,.35,true); S.stats.extra++; setFeedback('音の場所ではありません（余計な音）','bad'); return; }
  const {c,d} = best; const ms = Math.round(judgeDeltaMs(d));
  strike(midi,.42); c.played=true; c.delta=ms; S.stats.deltas.push(ms);
  const a = Math.abs(d);
  if(a<=perfU()){ c.state='hit'; S.stats.hit++; setFeedback(`${c.p.solfege} ばっちり！（${ms>=0?'+':''}${ms}ms）`,'ok'); }
  else { c.state='near'; S.stats.near++; setFeedback(`${c.p.solfege} おしい。${d<0?'少し早い':'少し遅い'}（${ms>=0?'+':''}${ms}ms）`,'warn'); }
  paintChip(c);
}
function setFeedback(t,cls){ const f=$('feedback'); f.textContent=t; f.style.color = cls?`var(--${cls})`:''; }
function highlightTargets(){ document.querySelectorAll('.bigbtn').forEach(b=>b.classList.toggle('target', S.pending.some(c=>c.midi===+b.dataset.midi))); }
function clearTargets(){ document.querySelectorAll('.bigbtn').forEach(b=>b.classList.remove('target')); }

function showResults(){
  const st=S.stats; if(!st) return;
  const total = S.cs.cues.filter(c=>c.state!=='skip').length;
  const r=$('result'); r.classList.add('on');
  const avg = st.deltas.length? Math.round(st.deltas.reduce((a,b)=>a+b,0)/st.deltas.length):null;
  let html = `<h2>結果（${S.mode==='step'?'ステップ':'タイミング'}）</h2><div class="nums">`;
  if(S.mode==='step') html += `<span class="ok">正しく押せた ${st.hit}/${total}</span><span class="bad">まちがい ${st.extra}</span>`;
  else html += `<span class="ok">ばっちり ${st.hit}</span><span class="warn">おしい ${st.near}</span><span class="bad">見逃し ${st.miss}</span><span>余計 ${st.extra}</span>`;
  html += `</div>`;
  if(avg!==null) html += `<p class="modehelp">平均のずれ ${avg>=0?'+':''}${avg}ms（${avg>40?'遅め':avg<-40?'早め':'ほぼ合っています'}）。いつも同じ向きにずれるなら「判定のずれ補正」を動かしてください。</p>`;
  r.innerHTML = html;
}

/* ---------- 画面表示 ---------- */
function hudIdle(){
  const cs=S.cs; const order=cs.song.playOrder;
  const mi=Math.max(0,Math.min(Math.floor(S.cursor/cs.meter+1e-6),order.length-1));
  $('pos').firstChild.nodeValue=order[mi]+'小節'; $('posSub').textContent='ここから始まります';
  const first = cs.cues.find(c=>c.t>=S.cursor-1e-6);
  $('next').innerHTML = first? nextHtml(first, null) : '';
  clearTargets();
  const ban=$('banner'); ban.classList.remove('on'); ban.textContent='';
}
function nextHtml(c, away){
  const li=laneIndex(c);
  const when = (away==null||away<=0.05)? `${c.mnum}小節 ${fmtBeat(c.beat)}` : `${c.mnum}小節 ${fmtBeat(c.beat)}（あと ${Math.max(0,away).toFixed(1)}${(S.cs.song.hudSuffix||'拍')}）`;
  return `<span class="chip" style="--c:${lanesColor(li)}">${c.p.solfege}</span><div class="txt"><b>つぎは ${c.p.solfege}（${c.p.name}）${c.tremolo?' ゆらす':''}</b><span>${when}</span></div>`;
}
let lastNext=null;
function hud(){
  const cs=S.cs;
  const idx = Math.floor(S.pos/cs.meter);
  if(S.pos < S.countUntil-1e-6){
    const n = Math.ceil((S.countUntil - S.pos - 1e-6)/S.cs.pulse);
    $('pos').firstChild.nodeValue = 'カウント '+n; $('posSub').textContent='準備';
  } else {
    const m = cs.song.playOrder[Math.min(idx,cs.song.playOrder.length-1)];
    const b = Math.floor(S.pos - idx*cs.meter + 1e-6)+1;
    $('pos').firstChild.nodeValue = `${m}小節 ${b}${S.cs.song.hudSuffix||'拍'}`; $('posSub').textContent = (S.cs.song.voltas&&S.cs.song.voltas[m])||(S.waiting?'あなたの番':'再生中');
  }
  const nc = S.waiting? S.pending[0] : nextPendingCue();
  const key = nc? nc.id+(S.waiting?'w':'') : 'none';

let _ff=null; function FONTFAM(){ return _ff || (_ff=getComputedStyle(document.body).fontFamily); }
const cv = $('stage'); const g = cv.getContext('2d');
let W=0,H=0,dpr=1, themeCache=null, themeAt=0;
function fit(){ dpr=Math.min(2,window.devicePixelRatio||1); const r=cv.getBoundingClientRect(); W=r.width; H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function theme(){
  const now=performance.now();

    themeCache={fg:cssVar('--stage-fg'),dim:cssVar('--stage-dim'),line:cssVar('--stage-line'),
      c:[cssVar('--chime1'),cssVar('--chime2'),cssVar('--chime3')],ok:cssVar('--ok'),warn:cssVar('--warn'),bad:cssVar('--bad'),stage:cssVar('--stage'),
      paper:cssVar('--paper'),ink:cssVar('--ink'),inkDim:cssVar('--ink-dim'),staff:cssVar('--staff')};

}
function draw(){
  if(S.mode==='metro') return;
  if(S.view==='score') return drawScore();

}
function drawRoll(){
  const T=theme(), cs=S.cs; if(!cs||!W) return;
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  g.fillStyle=T.stage; g.fillRect(0,0,W,H);
  const pos = S.running? S.pos : S.cursor;
  const nowX = Math.min(W*.24,110), ppb = ppbRoll();
  const X = t => nowX + (t-pos)*ppb;
  const top=30, nl=cs.lanes.length, laneH = nl>2?44:52, lanesY=top+8, melY = lanesY+nl*laneH+10, melH = Math.max(34,H-melY-8);
  g.font='600 12px '+FONTFAM(); g.textBaseline='middle';
  // 小節線・拍
  const order=cs.song.playOrder;
  for(let i=0;i<=order.length;i++){
    const x=X(i*cs.meter); if(x<-60||x>W+60) continue;
    g.strokeStyle=T.line; g.lineWidth=1.5; g.beginPath(); g.moveTo(x,top-4); g.lineTo(x,H-4); g.stroke();
    if(i<order.length){ g.fillStyle=T.dim; g.textAlign='left'; g.fillText(String(order[i]),x+5,14); }
    for(let b=1;b<cs.meter&&i<order.length;b++){ const bx=X(i*cs.meter+b); g.strokeStyle=T.line; g.lineWidth=.6; g.beginPath(); g.moveTo(bx,top); g.lineTo(bx,H-8); g.stroke(); }
  }
  // 自分のレーン
  cs.lanes.forEach((p,i)=>{
    const y=lanesY+i*laneH+laneH/2;
    g.strokeStyle=T.line; g.lineWidth=1; g.setLineDash([2,5]); g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); g.setLineDash([]);
  });

    const x=X(c.t); if(x<-80||x>W+120) continue;
    const li=laneIndex(c), y=lanesY+li*laneH+laneH/2, col=T.c[li%3];
    if(c.tremolo){ g.strokeStyle=col; g.lineWidth=2; g.globalAlpha=.7; g.beginPath(); const x2=X(c.t+c.dur); for(let xx=x;xx<=x2;xx+=3){ const yy=y+Math.sin((xx-x)/3)*4; xx===x?g.moveTo(xx,yy):g.lineTo(xx,yy);} g.stroke(); g.globalAlpha=1; }
    const past = c.t<pos-0.05, st=c.state;

    if(!past && c.t-pos<1.0 && S.running){ const k=1-(c.t-pos); g.strokeStyle=col; g.globalAlpha=.5*k; g.lineWidth=3; g.beginPath(); g.arc(x,y,r+4+k*8,0,7); g.stroke(); }
    g.globalAlpha=alpha;
    g.fillStyle = st==='hit'?T.ok : st==='near'?T.warn : st==='miss'?T.bad : col;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    g.fillStyle='#fff'; g.textAlign='center'; g.font='900 14px '+FONTFAM();
    g.fillStyle = '#ffffff'; g.fillText(c.p.solfege,x,y+1);
    g.globalAlpha=1;
  }
  // メロディ(右手の最も高い音の流れ)。実際の上下がわかるよう縦に広く使い、音名を付ける。
  const mids=cs.melody.map(m=>m.midi).sort((a,b)=>a-b);
  const lo=mids[Math.floor(mids.length*0.03)], hi=Math.max(lo+5, mids[Math.min(mids.length-1,Math.floor(mids.length*0.97))]);
  const yOf=midi=>{ const c=Math.max(lo,Math.min(hi,midi)); return melY+melH-16-(c-lo)/(hi-lo)*(melH-44); };
  const ff=FONTFAM();
  g.font='600 11px '+ff; g.fillStyle=T.dim; g.textAlign='left'; g.fillText('メロディ',6,melY-2);
  // 高さの目安線(ドの音)
  g.strokeStyle=T.line; g.lineWidth=.6; g.setLineDash([2,4]);
  for(let c=Math.ceil(lo/12)*12; c<=hi; c+=12){ const yy=yOf(c); g.beginPath(); g.moveTo(0,yy); g.lineTo(W,yy); g.stroke(); }
  g.setLineDash([]);

  g.strokeStyle=T.dim; g.lineWidth=1.5; g.beginPath(); let started=false;
  for(const m of cs.melody){
    const w=Math.max(4,m.dur*ppb-3), x=X(m.t)+w/2; if(x<-60) continue; if(x>W+60) break;
    const y=yOf(m.midi); if(started) g.lineTo(x,y); else { g.moveTo(x,y); started=true; }
  }
  g.stroke();
  for(const m of cs.melody){
    const w=Math.max(4,m.dur*ppb-3), x=X(m.t); if(x+w<0) continue; if(x>W) break;
    const y=yOf(m.midi), past=m.t<pos-0.05;

  g.fillStyle=T.fg; g.textAlign='center'; g.font='700 11px '+FONTFAM(); g.fillText('いま',nowX,H-10);

    const y=lanesY+i*laneH+laneH/2; g.textAlign='left';
    g.fillStyle=T.stage; g.globalAlpha=.8; g.fillRect(2,y-11,38,22); g.globalAlpha=1;
    g.fillStyle=T.c[i%3]; g.font='900 13px '+FONTFAM(); g.fillText(p.solfege,6,y);

    const y=lanesY+li*laneH+laneH/2; g.globalAlpha=1-age/260; g.strokeStyle=T.c[li%3]; g.lineWidth=4;

  }

function frame(){

function setBpm(v){

  $('bpm').value=v; $('bpmVal').textContent=((S.mode!=='metro'&&S.cs&&S.cs.song.tempoMark)||'♩=')+v; $('metroBpm').textContent=v;
  store.set(S.mode==='metro'?'bpm.metro':'bpm.'+S.cs.song.id, v);
}
function ppbRoll(){ return Math.max(46,Math.min(84,W/9))*((S.cs&&S.cs.song.zoom)||1); }

function firstIndexOf(m){ return S.cs.song.playOrder.indexOf(m); }
function setStart(idx){
  idx=Math.max(0,Math.min(idx,S.cs.song.playOrder.length-1));
  S.startIdx=idx; S.cursor=idx*S.cs.meter;
  const f=firstIndexOf(S.cs.song.playOrder[idx]); if($('startSel').value!=String(f)) $('startSel').value=f;

    S.pos=b; S.waiting=false; S.pending=[]; clearTargets(); S.bannerUntil=0;
    const bn=$('banner'); bn.classList.remove('on'); bn.textContent='';
    S.evIdx=cs.events.findIndex(e=>e.t>=b-1e-6); if(S.evIdx<0) S.evIdx=cs.events.length;

function curPos(){ return S.running? S.pos : S.cursor; }
function seekMeasures(d){

let seekDrag=false;
(function(){

    drag={x:e.clientX,start:curPos(),moved:false};
  });

/* ---------- ピアノ譜(大譜表)の表示 ---------- */
const LAY = {sp:12, tBot:150, bBot:262, tDia:30, bDia:18};   // 五線の間隔と、最下線の位置(ト音:E4=30, ヘ音:G2=18)
const LETTER = 'CDEFGAB';
function scorePPU(c){ const w=((c||S.cs||{}).whole)||4; return 66/(w/4); }
function yDia(hand, dia){ return hand==='RH' ? LAY.tBot-(dia-LAY.tDia)*LAY.sp/2 : LAY.bBot-(dia-LAY.bDia)*LAY.sp/2; }
const KEY_ORDER_SHARP = ['F','C','G','D','A','E','B'], KEY_ORDER_FLAT = ['B','E','A','D','G','C','F'];
const KEY_POS = { // 調号の位置(音の高さ index) ト音/ヘ音
  sharp:{T:[38,35,39,36,33,37,34], B:[24,21,25,22,19,23,20]},
  flat:{T:[34,37,33,36,32,35,31], B:[20,23,19,22,18,21,17]} };

function buildScore(cs, kf){
  const whole=cs.whole, meter=cs.meter, ppu=scorePPU(cs), sp=LAY.sp;
  const beamUnit = cs.song.beamUnit || (whole===8 && meter%3===0 ? 3 : cs.pulse);
  const groups = new Map();
  for(const e of cs.entries){ const k=e.idx+'|'+e.hand; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e); }
  const beams = [];
  groups.forEach(list=>{
    const hand=list[0].hand, mid = hand==='RH' ? 34 : 22;
    for(const e of list){
      e.r = e.dur/whole; e.end = e.t+e.dur;
      for(const n of e.notes) n.dia = n.oct*7 + LETTER.indexOf(n.letter);
      e.notes.sort((a,b)=>a.dia-b.dia);
      if(e.notes.length){ e.bot=e.notes[0].dia; e.top=e.notes[e.notes.length-1].dia; }
      const base = Math.pow(2, Math.floor(Math.log2(e.r+1e-9)));
      e.dotted = Math.abs(e.r/base-1.5)<0.02;
      e.dur2 = e.r>=1-1e-6 ? 'whole' : (e.r/(e.dotted?1.5:1))>=.5-1e-6 ? 'half' : (e.r/(e.dotted?1.5:1))>=.25-1e-6 ? 'quarter' : (e.r/(e.dotted?1.5:1))>=.125-1e-6 ? 'eighth' : 'sixteenth';
    }
    const real = list.filter(e=>!e.rest).sort((a,b)=>a.t-b.t || b.top-a.top);
    // 声部: 時間が重なる音符があれば上声(0)/下声(1)に分ける
    let overlap=false;
    for(let i=0;i<real.length;i++) for(let j=i+1;j<real.length;j++) if(real[i].t<real[j].end-1e-6 && real[j].t<real[i].end-1e-6) overlap=true;
    const seen=new Set(); let busyU=-1e9;
    for(const e of real){
      if(!overlap){ e.voice=-1; continue; }
      const k=e.t.toFixed(3); let v;
      if(seen.has(k)) v=1; else if(busyU<=e.t+1e-6) v=0; else v=1;
      seen.add(k); e.voice=v; if(v===0) busyU=e.end;
    }
    // 符幹の向き
    for(const e of real){
      if(e.voice===0) e.up=true; else if(e.voice===1) e.up=false;
      else { const far = Math.abs(e.top-mid)>=Math.abs(e.bot-mid) ? e.top : e.bot; e.up = far<mid; }
    }
    // 連桁(8分音符以下が連続し、同じ拍グループにある音符)
    const byVoice = new Map();
    for(const e of real){ const k=String(e.voice); if(!byVoice.has(k)) byVoice.set(k,[]); byVoice.get(k).push(e); }
    byVoice.forEach(vl=>{
      let cur=[];
      const flush=()=>{
        if(cur.length>=2){
          const avg=cur.reduce((s,e)=>s+(Math.abs(e.top-mid)>=Math.abs(e.bot-mid)?e.top:e.bot),0)/cur.length;
          const forced = cur[0].voice>=0;
          const up = forced ? cur[0].up : avg<mid;
          cur.forEach(e=>{ e.up=up; });
          beams.push({entries:cur.slice(), up, hand});
          cur.forEach(e=>{ e.beam=true; });
        }
        cur=[];
      };
      for(const e of vl){
        const win = Math.floor((e.beat-1+1e-6)/beamUnit);
        if(e.r<=.125+1e-6 && !e.rest){
          if(cur.length && Math.abs(cur[cur.length-1].end-e.t)<1e-6 && Math.floor((cur[0].beat-1+1e-6)/beamUnit)===win) cur.push(e);
          else { flush(); cur=[e]; }
        } else flush();
      }
      flush();
    });
    // 臨時記号(調号で決まる音は付けない。小節内で一度付けたら、その小節では効く)
    const state=new Map();
    for(const e of real){
      for(const n of e.notes){
        const kk=n.letter+n.oct;
        const kAlt = kf.flats.includes(n.letter) ? -1 : (kf.sharps.includes(n.letter) ? 1 : 0);
        const alt = n.acc==='♭' ? -1 : n.acc==='♯' ? 1 : 0;
        const cur = state.has(kk) ? state.get(kk) : kAlt;
        n.sign = alt!==cur ? (alt<0?'♭':alt>0?'♯':'♮') : '';
        state.set(kk,alt);
      }
      // 2度の音符は左右にずらす
      const ns=e.notes; for(const n of ns) n.disp=0;
      if(e.up){ for(let i=1;i<ns.length;i++) if(ns[i].dia-ns[i-1].dia===1 && ns[i-1].disp===0) ns[i].disp=1; }
      else { for(let i=ns.length-2;i>=0;i--) if(ns[i+1].dia-ns[i].dia===1 && ns[i+1].disp===0) ns[i].disp=-1; }
    }
  });
  // 連桁の形(傾き)を決める
  const hw=sp*1.25;
  for(const b of beams){
    const e0=b.entries[0], eN=b.entries[b.entries.length-1];
    const tipOf=e=>{ const yTop=yDia(b.hand,e.top), yBot=yDia(b.hand,e.bot); return b.up ? yTop-3.4*sp : yBot+3.4*sp; };
    let y1=tipOf(e0), y2=tipOf(eN);
    if(Math.abs(y2-y1)>1.4*sp){ if(Math.abs(y1-yDia(b.hand,e0.top))<Math.abs(y2-yDia(b.hand,eN.top))) y2=y1+Math.sign(y2-y1)*1.4*sp; else y1=y2-Math.sign(y2-y1)*1.4*sp; }
    const slope = (y2-y1)/(Math.max(1e-6,(eN.t-e0.t)*ppu));
    // どの符幹も最低 2.6 スペースの長さにする
    let shift=0;
    for(const e of b.entries){
      const yAt = y1 + (e.t-e0.t)*ppu*slope;
      const need = b.up ? yDia(b.hand,e.top)-2.6*sp : yDia(b.hand,e.bot)+2.6*sp;
      shift = b.up ? Math.max(shift, yAt-need) : Math.min(shift, yAt-need);
    }
    b.y1 = y1 - shift; b.slope=slope; b.t1=e0.t;
  }
  // 調号・拍子記号
  const nSharp = (cs.song.keySharps||[]).length, nFlat=(cs.song.keyFlats||[]).length;
  const keyN = nSharp||nFlat, panelW = 12+34+(keyN? keyN*10+8 : 0)+30+8;
  return {beams, panelW, keyN, keyType: nSharp?'sharp':'flat', hw};
}

function drawScore(){
  const T=theme(), cs=S.cs; if(!cs||!W) return;
  const sc=cs.score, sp=LAY.sp, hw=sc.hw, ppu=scorePPU();
  const ff=FONTFAM();
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=T.paper; g.fillRect(0,0,W,H);
  const pos = S.running? S.pos : S.cursor;
  const nowX = Math.max(sc.panelW+40, W*.3), X=t=>nowX+(t-pos)*ppu, NX=t=>X(t)+hw*1.5;   // 音符は小節線から少し右に置く
  const tTop=LAY.tBot-4*sp, bTop=LAY.bBot-4*sp, bBot=LAY.bBot;
  const order=cs.song.playOrder;
  g.textBaseline='middle';
  // 五線
  g.strokeStyle=T.staff; g.lineWidth=1;
  for(const bot of [LAY.tBot,LAY.bBot]) for(let k=0;k<5;k++){ const y=bot-k*sp; g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  // 小節線・小節番号
  const i0=Math.max(0,Math.floor(pos/cs.meter-(nowX/ppu)/cs.meter)-1), i1=Math.min(order.length,Math.ceil(pos/cs.meter+((W-nowX)/ppu)/cs.meter)+1);
  g.font='600 11px '+ff;
  for(let i=i0;i<=i1;i++){
    const x=X(i*cs.meter); g.strokeStyle=T.staff; g.lineWidth=1.2; g.beginPath(); g.moveTo(x,tTop); g.lineTo(x,bBot); g.stroke();
    if(i<order.length){ g.fillStyle=T.inkDim; g.textAlign='left'; g.fillText(String(order[i]),x+4,11); }
  }
  // いま線(音符の中心がこの線を通った瞬間に鳴る)
  g.strokeStyle = S.waiting ? T.warn : T.ink; g.lineWidth = S.waiting?3.5:2; g.globalAlpha = S.waiting?.9:.3;
  g.beginPath(); g.moveTo(NX(pos),tTop-60); g.lineTo(NX(pos),bBot+46); g.stroke(); g.globalAlpha=1;
  // 音符
  const colOf=(n)=>{ const li=cs.lanes.findIndex(l=>l.midi===n.midi); return li<0?T.c[0]:T.c[li%3]; };
  const names=$('optNames').checked, chips=[];
  const visible=e=>{ const x=NX(e.t); return x>sc.panelW-30 && x<W+30; };
  const drawHead=(e,n,x)=>{
    const cx=x+n.disp*hw, cy=yDia(e.hand,n.dia), mine=!!n.cue;
    const past=e.t<pos-0.05;
    g.globalAlpha=past?.38:1;
    // 加線
    const bot=e.hand==='RH'?LAY.tDia:LAY.bDia, top=bot+8;
    g.strokeStyle=T.ink; g.lineWidth=1.2;
    if(n.dia<bot){ for(let d=bot-2; d>=n.dia; d-=2){ const yy=yDia(e.hand,d); g.beginPath(); g.moveTo(cx-hw*.95,yy); g.lineTo(cx+hw*.95,yy); g.stroke(); } }
    if(n.dia>top){ for(let d=top+2; d<=n.dia; d+=2){ const yy=yDia(e.hand,d); g.beginPath(); g.moveTo(cx-hw*.95,yy); g.lineTo(cx+hw*.95,yy); g.stroke(); } }
    let col=T.ink;
    if(mine){ const st=n.cue.state; col = st==='hit'?T.ok : st==='near'?T.warn : st==='miss'?T.bad : colOf(n); }
    g.save(); g.translate(cx,cy); g.rotate(-.35);
    g.beginPath(); g.ellipse(0,0,hw*.6,sp*.46,0,0,7);
    if(e.dur2==='whole'){ g.lineWidth=2.4; g.strokeStyle=col; g.stroke(); }
    else if(e.dur2==='half'){ g.lineWidth=2; g.strokeStyle=col; g.stroke(); }
    else { g.fillStyle=col; g.fill(); }
    g.restore();
    if(mine){
      g.lineWidth=2.4; g.strokeStyle=col; g.globalAlpha=past?.35:.9;
      g.beginPath(); g.arc(cx,cy,hw*1.05,0,7); g.stroke();
    }
    g.globalAlpha=past?.38:1;
    // 臨時記号
    if(n.sign){ g.fillStyle=T.ink; g.font='700 '+Math.round(sp*1.7)+'px "Noto Music","Segoe UI Symbol",serif'; g.textAlign='right'; g.fillText(n.sign,cx-hw*.85,cy-1); }
    // 付点
    if(e.dotted){ const onLine = ((n.dia-(e.hand==='RH'?LAY.tDia:LAY.bDia))%2)===0; g.fillStyle=T.ink; g.beginPath(); g.arc(x+hw*(1.0+Math.max(0,n.disp)*.9)+3, cy-(onLine?sp*.5:0), 1.9,0,7); g.fill(); }
    // 音名
    if(mine || names){
      g.font=(mine?'800 11px ':'600 9px ')+ff; g.textAlign='center';
      if(mine){
        // 担当音は、五線の外側に色つきのラベルを出す(最後にまとめて最前面へ描く)
        const lbl = (cs.lanes.find(l=>l.midi===n.midi)||n).solfege;
        chips.push({cx,cy,hand:e.hand,lbl,col,past});
      } else {
        g.fillStyle=T.inkDim; g.strokeStyle=T.paper; g.lineWidth=3; const lbl=n.solfege; g.strokeText(lbl,cx,cy+sp*1.05); g.fillText(lbl,cx,cy+sp*1.05);
      }
    }
    g.globalAlpha=1;
  };
  const stemOf=(e,x,tipY)=>{
    const past=e.t<pos-0.05; g.globalAlpha=past?.38:1;
    const sx = x + (e.up ? hw*.58 : -hw*.58);
    const yTop=yDia(e.hand,e.top), yBot=yDia(e.hand,e.bot);
    g.strokeStyle=T.ink; g.lineWidth=1.4; g.beginPath();
    if(e.up){ g.moveTo(sx,yBot); g.lineTo(sx,tipY); } else { g.moveTo(sx,yTop); g.lineTo(sx,tipY); }
    g.stroke(); g.globalAlpha=1;
    return sx;
  };
  const midY = h => h==='RH' ? LAY.tBot-2*sp : LAY.bBot-2*sp;
  const drawn=new Set();
  for(const b of sc.beams){
    const eFirst=b.entries[0], eLast=b.entries[b.entries.length-1];
    if(NX(eLast.t)<sc.panelW-40 || NX(eFirst.t)>W+40) continue;
    const yAt = t => b.y1 + (t-b.t1)*ppu*b.slope;
    let sxs=[];
    for(const e of b.entries){
      drawn.add(e); const x=NX(e.t);
      for(const n of e.notes) drawHead(e,n,x);
      sxs.push(stemOf(e,x,yAt(e.t)));
    }
    const past=eLast.t<pos-0.05; g.globalAlpha=past?.38:1; g.fillStyle=T.ink;
    const th=sp*.42, dir=b.up?1:-1;
    g.beginPath(); g.moveTo(sxs[0],yAt(eFirst.t)); g.lineTo(sxs[sxs.length-1],yAt(eLast.t)); g.lineTo(sxs[sxs.length-1],yAt(eLast.t)+dir*th); g.lineTo(sxs[0],yAt(eFirst.t)+dir*th); g.closePath(); g.fill();
    g.globalAlpha=1;
  }
  for(const e of cs.entries){
    if(drawn.has(e) || !visible(e)) continue;
    const x=NX(e.t);
    if(e.rest){
      // 小節全体の休符(全休符)
      if(e.dur>=cs.meter-1e-6){ const y=(e.hand==='RH'?LAY.tBot:LAY.bBot)-3*sp, cx=X(e.t+e.dur/2); g.globalAlpha=e.t<pos-0.05?.38:1; g.fillStyle=T.ink; g.fillRect(cx-hw*.55,y,hw*1.1,sp*.5); g.globalAlpha=1; }
      else if(S.musicFont){
        const gl={half:'\u{1D13C}',quarter:'\u{1D13D}',eighth:'\u{1D13E}',sixteenth:'\u{1D13F}'}[e.dur2];
        if(gl){ g.globalAlpha=e.t<pos-0.05?.38:1; g.fillStyle=T.ink; g.font=Math.round(sp*4)+'px "Noto Music",serif'; g.textAlign='center'; g.fillText(gl,x,midY(e.hand)+sp*.1+(e.pos==='low'?sp*1.7:e.pos==='high'?-sp*1.7:0)); g.globalAlpha=1; }
      }
      continue;
    }
    for(const n of e.notes) drawHead(e,n,x);
    if(e.dur2!=='whole'){
      const yTop=yDia(e.hand,e.top), yBot=yDia(e.hand,e.bot);
      let tip = e.up ? yTop-3.4*sp : yBot+3.4*sp;
      const m=midY(e.hand); tip = e.up ? Math.min(tip,m) : Math.max(tip,m);
      const sx=stemOf(e,x,tip);
      if(e.dur2==='eighth'||e.dur2==='sixteenth'){
        const past=e.t<pos-0.05; g.globalAlpha=past?.38:1; g.strokeStyle=T.ink; g.lineWidth=2; g.beginPath();
        if(e.up){ g.moveTo(sx,tip); g.bezierCurveTo(sx+hw*.2,tip+sp*1.0,sx+hw*1.15,tip+sp*1.7,sx+hw*.7,tip+sp*3.1); }
        else { g.moveTo(sx,tip); g.bezierCurveTo(sx+hw*.2,tip-sp*1.0,sx+hw*1.15,tip-sp*1.7,sx+hw*.7,tip-sp*3.1); }
        g.stroke(); g.globalAlpha=1;
      }
    }
  }
  // 担当音のラベル(最前面)
  g.font='800 11px '+ff; g.textAlign='center';
  for(const c of chips){
    const ly = c.hand==='RH' ? 30 : bBot+32, w = g.measureText(c.lbl).width+12;   // 上の端/下の端に並べる(音符に重ならない)
    g.globalAlpha=c.past?.4:1; g.fillStyle=c.col; g.beginPath(); if(g.roundRect) g.roundRect(c.cx-w/2,ly-9,w,18,9); else g.rect(c.cx-w/2,ly-9,w,18); g.fill();
    g.fillStyle='#fff'; g.fillText(c.lbl,c.cx,ly+1); g.globalAlpha=1;
  }
  // 次の担当音の予告(つよい輪)
  const nc = S.waiting ? S.pending[0] : cs.cues.find(c=>c.state==='pending' && c.t>=pos-0.6);
  if(nc){
    const e=cs.entries.find(en=>en.idx===nc.idx && en.notes.some(n=>n.cue===nc));
    if(e){ const n=e.notes.find(n=>n.cue===nc), cx=NX(e.t)+n.disp*hw, cy=yDia(e.hand,n.dia);
      const k=S.waiting?1:Math.max(0,Math.min(1,1-(nc.t-pos)/(cs.pulse*1.0)));
      if(k>0 || S.waiting){ const li=cs.lanes.findIndex(l=>l.midi===nc.midi); g.strokeStyle=T.c[li%3]; g.lineWidth=3; g.globalAlpha=S.waiting?1:.6*k; g.beginPath(); g.arc(cx,cy,hw*(1.35+ (S.waiting?.15*Math.sin(performance.now()/90):.5*(1-k))),0,7); g.stroke(); g.globalAlpha=1; }
    }
  }
  // 左の固定部分(音部記号・調号・拍子記号)
  g.fillStyle=T.paper; g.fillRect(0,0,sc.panelW,H);
  g.strokeStyle=T.staff; g.lineWidth=1;
  for(const bot of [LAY.tBot,LAY.bBot]) for(let k=0;k<5;k++){ const y=bot-k*sp; g.beginPath(); g.moveTo(0,y); g.lineTo(sc.panelW,y); g.stroke(); }
  g.strokeStyle=T.ink; g.lineWidth=1.6; g.beginPath(); g.moveTo(4,tTop); g.lineTo(4,bBot); g.stroke();
  g.strokeStyle=T.staff; g.lineWidth=1.2; g.beginPath(); g.moveTo(sc.panelW,tTop); g.lineTo(sc.panelW,bBot); g.stroke();
  // 音部記号
  g.fillStyle=T.ink; g.textAlign='center';
  if(S.musicFont){
    g.font=Math.round(sp*5.4)+'px "Noto Music",serif'; g.fillText('\u{1D11E}',26,LAY.tBot-sp*1.2);
    g.font=Math.round(sp*3.6)+'px "Noto Music",serif'; g.fillText('\u{1D122}',26,LAY.bBot-sp*3.0);
  } else {
    g.font='700 11px '+ff; g.fillText('ト音',24,LAY.tBot-2*sp); g.fillText('ヘ音',24,LAY.bBot-2*sp);
  }
  // 調号
  const kp=KEY_POS[sc.keyType], ks=sc.keyN;
  g.font='700 '+Math.round(sp*1.9)+'px "Noto Music","Segoe UI Symbol",serif'; g.textAlign='center';
  for(let i=0;i<ks;i++){
    const xx=46+i*10, glyph = sc.keyType==='sharp' ? '♯' : '♭';
    g.fillText(glyph,xx,yDia('RH',kp.T[i])-1); g.fillText(glyph,xx,yDia('LH',kp.B[i])-1);
  }
  // 拍子記号
  const tx = 46+(ks?ks*10+6:0)+10;
  g.font='900 '+Math.round(sp*2.2)+'px '+ff; g.textAlign='center';
  g.fillText(String(cs.meter),tx,LAY.tBot-3*sp); g.fillText(String(cs.whole),tx,LAY.tBot-sp);
  g.fillText(String(cs.meter),tx,LAY.bBot-3*sp); g.fillText(String(cs.whole),tx,LAY.bBot-sp);
}

function setView(v, init){
  S.view = v==='score' ? 'score' : 'roll'; store.set('view',S.view);
  $('stagewrap').classList.toggle('paper', S.view==='score');
  $('namesTg').style.visibility = S.view==='score' ? 'visible' : 'hidden';
  document.querySelectorAll('input[name=view]').forEach(r=>{ r.checked = r.value===S.view; });
}
S.musicFont=false;
try{
  if(document.fonts && document.fonts.load){
    document.fonts.load('40px "Noto Music"','\u{1D11E}').then(f=>{ S.musicFont = !!(f&&f.length) && document.fonts.check('40px "Noto Music"','\u{1D11E}'); }).catch(()=>{});
  }
}catch(e){}


/* ---------- 入力 ---------- */
function bindUI(){
  $('btnPlay').addEventListener('click', ()=> S.mode==='metro' ? metroToggle() : start());
  $('btnStop').addEventListener('click', ()=>{ if(S.mode==='metro'){ metroStop(); return; } stop(false); setFeedback(''); });
  $('startSel').addEventListener('change', ()=>setStart(+$('startSel').value));
  $('bpm').addEventListener('input', e=>setBpm(+e.target.value));
  $('off').addEventListener('input', e=>{ S.offMs=+e.target.value; $('offVal').textContent=(S.offMs>=0?'+':'')+S.offMs+'ms'; store.set('off',S.offMs); });
  for(const id of ['optCount','optMetro','optOthers','loopOn']){
    const el=$(id); const v=store.get(id,null); if(v!==null) el.checked=v;
    el.addEventListener('change',()=>store.set(id,el.checked));
  }
  document.querySelectorAll('input[name=mode]').forEach(r=>{
    r.checked = r.value===S.mode;
    r.addEventListener('change',()=>setMode(r.value));
  });
  $('modeHelp').textContent=MODE_HELP[S.mode];
  $('offVal').textContent=(S.offMs>=0?'+':'')+S.offMs+'ms'; $('off').value=S.offMs;
  document.addEventListener('keydown', e=>{
    if(e.repeat || e.ctrlKey || e.metaKey || e.altKey || e.target.tagName==='SELECT' || e.target.tagName==='INPUT') return;
    const k=e.key.toLowerCase();
    if(S.mode==='metro'){ if(e.key===' '){ e.preventDefault(); metroToggle(); } return; }
    if(e.key==='ArrowLeft'){ e.preventDefault(); seekMeasures(-1); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); seekMeasures(1); return; }
    if(e.key===' '){
      e.preventDefault();
      let midi=null;
      if(S.running){ const c = S.waiting? S.pending[0] : nextPendingCue(); if(c) midi=c.midi; }
      if(midi==null) midi=S.cs.lanes[0].midi;
      const b=document.querySelector(`.bigbtn[data-midi="${midi}"]`); if(b){b.classList.add('down'); setTimeout(()=>b.classList.remove('down'),90);}
      press(midi);
    } else if(S.keyMap[k]!=null){
      const b=document.querySelector(`.bigbtn[data-midi="${S.keyMap[k]}"]`); if(b){b.classList.add('down'); setTimeout(()=>b.classList.remove('down'),90);}
      press(S.keyMap[k]);
    }
  });
  document.querySelectorAll('input[name=view]').forEach(r=>r.addEventListener('change',()=>setView(r.value)));
  const on=$('optNames'); const nv=store.get('optNames',null); if(nv!==null) on.checked=nv; on.addEventListener('change',()=>store.set('optNames',on.checked));
  bindExtra();
  document.addEventListener('keyup', e=>{ if(e.key===' ' && e.target.tagName==='BUTTON') e.preventDefault(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden && S.running) { stop(false); setFeedback('画面が隠れたので止めました'); } });
  const sel=$('songSel'); sel.innerHTML=S.songs.map(s=>`<option value="${s.id}">${s.title}</option>`).join('');
  sel.value = store.get('song', S.songs[0].id); if(!sel.value) sel.selectedIndex=0;
  sel.addEventListener('change',()=>{ stop(false); loadSong(sel.value); });
}
if(!S.songs.length){ document.body.innerHTML='<p style="padding:20px">曲データがありません。</p>'; return; }
S.countUntil=0; S.lastInt=0;
bindUI(); loadSong($('songSel').value); setMode(S.mode,true); setView(S.view,true); fit(); frame();
window.__chime = {S, compile, parsePitch}; // 検証用
})();
</script>
